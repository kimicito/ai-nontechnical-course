  .lang-dropdown { position: relative; }

  .lang-menu a:hover, .lang-menu a.active { background: rgba(139,92,246,0.15); color: var(--text); }

  .hamburger { display: none; flex-direction: column; gap: 4px; cursor: pointer; padding: 4px; }
  .hamburger span { width: 24px; height: 2px; background: var(--text); border-radius: 2px; transition: 0.3s; }
  .mobile-nav { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 300; padding: 80px 20px 20px; }
  .mobile-nav.show { display: block; }
  .mobile-nav a { display: block; padding: 12px 0; color: var(--text); text-decoration: none; font-size: 1.1rem; border-bottom: 1px solid var(--border); }
  .mobile-nav a.active { color: var(--accent); }
  .close-menu { position: absolute; top: 16px; right: 16px; font-size: 1.5rem; background: none; border: none; color: var(--text); cursor: pointer; }

  @media (max-width: 768px) {
    .desktop-nav { display: none; }
    .hamburger { display: flex; }

  .hero { padding: 60px 0 30px; }

  .update-item h3 a:hover { color: var(--accent); }
  .update-item p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

  footer { padding: 30px 0; border-top: 1px solid var(--border); margin-top: 40px; text-align: center; color: var(--muted); font-size: 0.85rem; }
